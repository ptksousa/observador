<form action="{% url 'login' %}" method="POST">
    {% csrf_token %}
    <div>
    {% for field in form.visible_fields %}
        <div>
            <label for="{{ field.id_for_label }}">{{field.label}}</label>
            {{ field }}
        </div>
    {% endfor %}
    </div>
    <div>
        <button type="submit" class="btn btn-success col-12" style="padding: top 5px;">Login</button>
    </div>
</form>
